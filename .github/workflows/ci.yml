name: Contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: genvm-lint check contracts/change_gate.py
      - run: genvm-lint schema contracts/change_gate.py --output /tmp/changegate-abi.json
      - run: diff docs/abi.json /tmp/changegate-abi.json
